<!doctype html>
<html lang="vi"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bộ sưu tập mới — Lavatiles</title>
  <meta name="description" content="Khám phá các bộ sưu tập gạch ốp lát và thiết bị vệ sinh mới nhất tại Lavatiles.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalogue.css">
  <link rel="stylesheet" href="css/catalogue-flipbook.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" as="style">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body class="static-listing-page">
<div data-site-header data-site-root="." data-active-nav="products"></div>

<header class="catalogue-hero" style="background: linear-gradient(90deg, rgba(19,18,16,0.68) 0%, rgba(19,18,16,0.22) 48%, rgba(19,18,16,0.18) 100%), linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.22) 100%), url('assets/showroom-hero.png') center/cover no-repeat;">
  <div class="container">
    <div class="catalogue-hero-copy" data-reveal="from-bottom">
      <span class="catalogue-kicker">Bộ sưu tập mới</span>
      <h1>Khám phá các bộ sưu tập mới nhất</h1>
      <p>Tra cứu nhanh các catalogue gạch ốp lát, thiết bị vệ sinh mới nhất từ các thương hiệu đối tác của Lavatiles.</p>
    </div>
  </div>
</header>

<main>
  <section class="catalogue-tabs-section">
    <div class="container">
      <div class="catalogue-grid">
        <article class="catalogue-card" data-reveal="from-bottom">
          <div class="catalogue-card-media"><img src="assets/images/catalogue/ga-at-catalogue-400x400.jpg" srcset="assets/images/catalogue/ga-at-catalogue-400x400.jpg 400w, assets/images/catalogue/ga-at-catalogue-800x800.jpg 800w" sizes="(min-width: 768px) 800px, 400px" alt="VietY Tile GA + AT"></div>
          <div class="catalogue-card-body">
            <h3>VietY Tile GA + AT SQ</h3>
            <div class="catalogue-card-actions">
              <button class="catalogue-card-action" data-flipbook-trigger data-flipbook-id="vietytile-ga-at" aria-label="Xem nhanh VietY Tile">
                <span>Xem nhanh</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <a class="catalogue-card-action" href="assets/pdf/GA+AT SQ.pdf" target="_blank" rel="noopener" aria-label="Tải PDF VietY Tile">
                <span>PDF</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
              </a>
            </div>
          </div>
        </article>
        <article class="catalogue-card" data-reveal="from-bottom">
          <div class="catalogue-card-media"><img src="assets/images/catalogue/viglacera-catalogue-400x400.png" srcset="assets/images/catalogue/viglacera-catalogue-400x400.png 400w, assets/images/catalogue/viglacera-catalogue-800x800.png 800w" sizes="(min-width: 768px) 800px, 400px" alt="Viglacera"></div>
          <div class="catalogue-card-body">
            <h3>Viglacera T1-2026</h3>
            <div class="catalogue-card-actions">
              <button class="catalogue-card-action" data-flipbook-trigger data-flipbook-id="viglacera" aria-label="Xem nhanh Viglacera">
                <span>Xem nhanh</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <a class="catalogue-card-action" href="assets/pdf/Catalogue T1-2026.pdf" target="_blank" rel="noopener" aria-label="Tải PDF Viglacera">
                <span>PDF</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
              </a>
            </div>
          </div>
        </article>
        <article class="catalogue-card" data-reveal="from-bottom">
          <div class="catalogue-card-media"><img src="assets/images/catalogue/toto-catalogue-400x400.png" srcset="assets/images/catalogue/toto-catalogue-400x400.png 400w, assets/images/catalogue/toto-catalogue-800x800.png 800w" sizes="(min-width: 768px) 800px, 400px" alt="TOTO"></div>
          <div class="catalogue-card-body">
            <h3>TOTO Mini 1H26</h3>
            <div class="catalogue-card-actions">
              <button class="catalogue-card-action" data-flipbook-trigger data-flipbook-id="toto" aria-label="Xem nhanh TOTO">
                <span>Xem nhanh</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <a class="catalogue-card-action" href="assets/pdf/260323_TOTO Mini_1H26_rev6_view (1)-đã nén.pdf" target="_blank" rel="noopener" aria-label="Tải PDF TOTO">
                <span>PDF</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
              </a>
            </div>
          </div>
        </article>
        <article class="catalogue-card" data-reveal="from-bottom">
          <div class="catalogue-card-media"><img src="assets/images/catalogue/inax-catalogue-400x400.jpg" srcset="assets/images/catalogue/inax-catalogue-400x400.jpg 400w, assets/images/catalogue/inax-catalogue-800x800.jpg 800w" sizes="(min-width: 768px) 800px, 400px" alt="INAX"></div>
          <div class="catalogue-card-body">
            <h3>INAX</h3>
            <div class="catalogue-card-actions">
              <button class="catalogue-card-action" data-flipbook-trigger data-flipbook-id="inax" aria-label="Xem nhanh INAX">
                <span>Xem nhanh</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <a class="catalogue-card-action" href="assets/pdf/INAX-CATALOGUE-01.04.2026.pdf" target="_blank" rel="noopener" aria-label="Tải PDF INAX">
                <span>PDF</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
              </a>
            </div>
          </div>
        </article>
        <article class="catalogue-card" data-reveal="from-bottom">
          <div class="catalogue-card-media"><img src="assets/images/catalogue/caesar-catalogue-400x400.png" srcset="assets/images/catalogue/caesar-catalogue-400x400.png 400w, assets/images/catalogue/caesar-catalogue-800x800.png 800w" sizes="(min-width: 768px) 800px, 400px" alt="Caesar"></div>
          <div class="catalogue-card-body">
            <h3>Caesar</h3>
            <div class="catalogue-card-actions">
              <button class="catalogue-card-action" data-flipbook-trigger data-flipbook-id="caesar" aria-label="Xem nhanh Caesar">
                <span>Xem nhanh</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <a class="catalogue-card-action" href="assets/pdf/CATALO 06-2026.pdf" target="_blank" rel="noopener" aria-label="Tải PDF Caesar">
                <span>PDF</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
              </a>
            </div>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>

<div data-site-footer data-site-root="."></div>

<button type="button" id="scrollTop" aria-label="Scroll to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
</button>

<script src="js/site-chrome.js"></script>
<script src="js/main.js"></script>
<script src="js/ui-feedback.js"></script>
<script src="data/catalogues.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/catalogue-flipbook.js"></script>

</body></html>
